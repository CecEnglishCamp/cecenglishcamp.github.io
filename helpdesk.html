<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>CEC Help Desk · CEC English Camp</title>
  <style>
    :root{--ink:#07111f;--navy:#0b2035;--cyan:#53d4e8;--cream:#f4f8fa;--muted:#9db0c1;--line:#24445d;--danger:#ffb4ab;--ok:#9bf0cf}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(145deg,var(--ink),#0e3047 58%,#123e54);color:var(--cream);font-family:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;min-height:100vh}
    .shell{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:28px 0 52px}
    .mast{display:flex;justify-content:space-between;gap:24px;align-items:end;padding:48px 0 32px;border-bottom:1px solid var(--line)}
    .eyebrow{color:var(--cyan);letter-spacing:.16em;font-size:.74rem;font-weight:700;text-transform:uppercase}
    h1{font-size:clamp(2rem,5vw,4rem);line-height:1.05;margin:12px 0 16px;max-width:720px}
    .lead{color:#c9d8e2;max-width:680px;line-height:1.7;margin:0}
    .layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,.65fr);gap:22px;padding-top:24px}
    .card{background:rgba(7,17,31,.72);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.16)}
    h2{font-size:1.25rem;margin:0 0 18px} h3{font-size:1rem;margin:0 0 10px;color:#e8faff}
    .section{padding:0 0 24px;margin:0 0 24px;border-bottom:1px solid rgba(157,176,193,.22)}
    .section:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
    .choice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}.choice label{display:block;border:1px solid var(--line);border-radius:12px;padding:13px 10px;text-align:center;color:#cfdee6;cursor:pointer;transition:.18s ease}.choice input:checked+label{border-color:var(--cyan);background:rgba(83,212,232,.13);color:#fff;box-shadow:0 0 0 2px rgba(83,212,232,.18)}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}
    label.field-label{display:block;font-size:.86rem;color:#c3d5df;margin:0 0 7px}
    input,select,textarea{width:100%;border:1px solid #31536b;border-radius:10px;background:#091827;color:#f7fbfd;padding:12px 13px;font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(83,212,232,.15)}textarea{min-height:154px;resize:vertical;line-height:1.55}
    .hint{font-size:.78rem;color:var(--muted);line-height:1.5;margin-top:6px}.safety{font-size:.86rem;line-height:1.6;color:#c7d8e0}.safety strong{color:#fff}.safety ul{margin:8px 0 0 18px;padding:0}
    .consent{display:flex;gap:10px;align-items:flex-start;color:#d3e2e8;font-size:.88rem;line-height:1.5}.consent input{width:18px;height:18px;margin-top:2px;flex:0 0 auto}
    .actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.primary,.secondary{border-radius:10px;padding:12px 17px;font:inherit;font-weight:700;cursor:pointer}.primary{border:1px solid var(--cyan);background:var(--cyan);color:#04202b}.secondary{border:1px solid #41647c;background:transparent;color:#e4f7fb}.primary:disabled,.secondary:disabled{opacity:.5;cursor:not-allowed}
    .status{min-height:24px;color:var(--danger);font-size:.88rem;line-height:1.5}.status.ok{color:var(--ok)}
    .receipt{position:sticky;top:20px}.receipt-box{border:1px dashed #41647c;border-radius:12px;padding:16px;color:#c4d6df;line-height:1.6}.receipt-box.empty{color:var(--muted)}.receipt-row{border-bottom:1px solid rgba(157,176,193,.2);padding:9px 0}.receipt-row:last-child{border-bottom:0}.receipt-label{display:block;font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.receipt-value{word-break:break-word}.guidance{white-space:pre-wrap;background:#0d2c3d;border-left:3px solid var(--cyan);padding:14px;border-radius:8px;color:#f2feff;margin-top:8px}.hidden{display:none!important}.small{font-size:.78rem;color:var(--muted)}
    @media(max-width:820px){.mast{display:block;padding-top:34px}.layout{grid-template-columns:1fr}.receipt{position:static}.choice-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.shell{width:min(100% - 20px,1120px);padding-top:14px}.card{padding:18px}.fields{grid-template-columns:1fr}.full{grid-column:auto}.choice-grid{gap:8px}.choice label{font-size:.86rem;padding:11px 7px}h1{font-size:2.2rem}}
    @media print{body{background:#fff;color:#111}.form-card,.actions,.status{display:none!important}.card{box-shadow:none;border:1px solid #bbb;background:#fff;color:#111}.receipt-value,.receipt-box,h2{color:#111}.receipt{position:static}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="mast">
      <div>
        <div class="eyebrow">CEC HELP DESK</div>
        <h1>궁금한 점을 편하게 알려 주세요.</h1>
        <p class="lead">로그인, 비밀번호, 수업 이용, 구독과 결제,<br>학습 진도에 관한 문의를 남겨 주세요.</p>
      </div>
    </header>
    <div class="layout">
      <section class="card form-card" aria-labelledby="form-title">
        <h2 id="form-title">문의 남기기</h2>
        <form id="inquiry-form" novalidate>
          <div class="section">
            <h3>누구신가요?</h3>
            <div class="choice-grid" role="radiogroup" aria-label="문의자 유형">
              <div class="choice"><input id="aud-student" name="audience" type="radio" value="학생"><label for="aud-student">학생</label></div>
              <div class="choice"><input id="aud-parent" name="audience" type="radio" value="학부모"><label for="aud-parent">학부모</label></div>
              <div class="choice"><input id="aud-mom" name="audience" type="radio" value="Mom Teacher"><label for="aud-mom">Mom Teacher</label></div>
              <div class="choice"><input id="aud-adult" name="audience" type="radio" value="성인 학습자"><label for="aud-adult">성인 학습자</label></div>
            </div>
          </div>
          <div class="section">
            <h3>문의 분야</h3>
            <select id="category" aria-label="문의 분야" required>
              <option value="">선택해 주세요</option><option>로그인</option><option>비밀번호</option><option>계정</option><option>수업 이용</option><option>기술 문제</option><option>구독·결제</option><option>학습 진도</option><option>개인정보</option><option>기타</option>
            </select>
          </div>
          <div class="section fields">
            <div><label class="field-label" for="requester-name">이름 *</label><input id="requester-name" maxlength="100" autocomplete="name" required></div>
            <div><label class="field-label" for="requester-email">이메일 *</label><input id="requester-email" type="email" maxlength="254" autocomplete="email" required></div>
            <div class="full"><label class="field-label" for="subject">제목 *</label><input id="subject" maxlength="200" required></div>
            <div><label class="field-label" for="student-name">학생 이름 또는 별명</label><input id="student-name" maxlength="100"></div>
            <div><label class="field-label" for="grade">학년 또는 과정</label><input id="grade" maxlength="100"></div>
            <div class="full"><label class="field-label" for="message">문의 내용 *</label><textarea id="message" maxlength="5000" required></textarea><div class="hint">비밀번호, 인증코드, 카드번호, 결제정보, API key, 로그인 token은 적지 마세요.</div></div>
          </div>
          <div class="section safety"><strong>적으면 도움이 되는 내용</strong><ul><li>문제가 시작된 시점</li><li>사용한 기기와 브라우저</li><li>문제가 발생한 수업 또는 화면</li><li>짧은 오류 문구</li></ul></div>
          <div class="section"><label class="consent"><input id="consent" type="checkbox" required><span>문의 확인을 위해 이름과 이메일을 사용하는 데 동의합니다. *</span></label></div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
          <div class="actions"><button id="submit-button" class="primary" type="submit">문의 접수</button><button id="new-button" class="secondary hidden" type="button">새 문의 작성</button></div>
        </form>
      </section>
      <aside class="card receipt" aria-labelledby="receipt-title">
        <h2 id="receipt-title">접수증</h2>
        <div id="receipt-empty" class="receipt-box empty">아직 접수된 문의가 없습니다.</div>
        <div id="receipt-content" class="receipt-box hidden">
          <div class="receipt-row"><span class="receipt-label">처리 상황</span><span id="receipt-status" class="receipt-value"></span></div>
          <div class="receipt-row"><span class="receipt-label">접수번호</span><span id="receipt-inquiry" class="receipt-value"></span></div>
          <div class="receipt-row"><span class="receipt-label">요청번호</span><span id="receipt-request" class="receipt-value"></span></div>
          <div class="receipt-row"><span class="receipt-label">문의 분야</span><span id="receipt-category" class="receipt-value"></span></div>
          <div class="receipt-row"><span class="receipt-label">접수 시각</span><span id="receipt-time" class="receipt-value"></span></div>
          <div class="receipt-row"><span class="receipt-label">안내</span><div id="receipt-guidance" class="receipt-value"></div></div>
          <div class="actions"><button id="copy-button" class="secondary" type="button">접수번호 복사</button><button id="print-button" class="secondary" type="button">인쇄</button></div>
        </div>
      </aside>
    </div>
  </main>
  <script>
    (() => {
      "use strict";
      const ENDPOINT = "https://cec-robo-router-preview.cecenglishcamp.workers.dev/robo/v1/inquiries";
      const MAX = { name: 100, email: 254, subject: 200, message: 5000 };
      const form = document.getElementById("inquiry-form");
      const submitButton = document.getElementById("submit-button");
      const newButton = document.getElementById("new-button");
      const status = document.getElementById("status");
      const category = document.getElementById("category");
      const receiptEmpty = document.getElementById("receipt-empty");
      const receiptContent = document.getElementById("receipt-content");
      const receiptGuidance = document.getElementById("receipt-guidance");
      let activeKey = null;
      let lastInquiryId = "";
      let lockedAfterSuccess = false;
      const byId = (id) => document.getElementById(id);
      const valueOf = (id) => byId(id).value.trim();
      const setStatus = (text, ok) => { status.textContent = text; status.className = ok ? "status ok" : "status"; };
      const audienceValue = () => { const selected = document.querySelector('input[name="audience"]:checked'); return selected ? selected.value : ""; };
      const finalMessage = () => {
        const lines = [];
        const audience = audienceValue();
        const student = valueOf("student-name");
        const grade = valueOf("grade");
        if (audience) lines.push("[문의자] " + audience);
        if (category.value) lines.push("[문의 분야] " + category.value);
        if (student) lines.push("[학생 이름] " + student);
        if (grade) lines.push("[학년 또는 과정] " + grade);
        lines.push(valueOf("message"));
        return lines.join("\n");
      };
      const clearReceipt = () => { receiptContent.classList.add("hidden"); receiptEmpty.classList.remove("hidden"); receiptGuidance.textContent = ""; };
      const showReceipt = (result, categoryText, guidanceText, messageText) => {
        receiptEmpty.classList.add("hidden"); receiptContent.classList.remove("hidden");
        byId("receipt-status").textContent = result.status === "auto_reply_ready" ? "접수 완료" : result.duplicate ? "이미 접수됨" : "접수됨";
        byId("receipt-inquiry").textContent = result.inquiry_id || "확인되지 않음";
        byId("receipt-request").textContent = result.request_id || "확인되지 않음";
        byId("receipt-category").textContent = categoryText;
        byId("receipt-time").textContent = new Date().toLocaleString("ko-KR");
        receiptGuidance.textContent = "";
        if (typeof guidanceText === "string" && guidanceText.length > 0) { const block = document.createElement("div"); block.className = "guidance"; block.textContent = guidanceText; receiptGuidance.appendChild(block); }
        else { receiptGuidance.textContent = messageText; }
        lastInquiryId = result.inquiry_id || "";
      };
      const errorMessage = (code, statusCode) => { if (statusCode === 400) return "입력한 내용을 다시 확인해 주세요."; if (statusCode === 403) return "현재 이 화면에서는 문의를 접수할 수 없습니다."; if (statusCode === 429) return "잠시 후 다시 확인해 주세요."; if (statusCode >= 500) return "문의 접수 중 문제가 발생했습니다.\n잠시 후 다시 확인해 주세요."; return code ? "문의 접수 중 문제가 발생했습니다." : "접수 결과를 확인하지 못했습니다.\n같은 문의를 바로 새로 작성하지 마세요.\n다시 확인하면 같은 접수번호로 확인합니다."; };
      const validate = () => {
        const name = valueOf("requester-name"), email = valueOf("requester-email"), title = valueOf("subject"), msg = finalMessage();
        if (!audienceValue() || !category.value || !name || !email || !title || !valueOf("message") || !byId("consent").checked) return "필수 항목을 모두 확인해 주세요.";
        if (name.length < 1 || name.length > MAX.name || email.length < 1 || email.length > MAX.email || title.length < 1 || title.length > MAX.subject || msg.length < 1 || msg.length > MAX.message) return "입력 가능한 글자 수를 확인해 주세요.";
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return "이메일 형식을 확인해 주세요.";
        return "";
      };
      const resetForm = () => { form.reset(); activeKey = null; lockedAfterSuccess = false; submitButton.disabled = false; newButton.classList.add("hidden"); clearReceipt(); setStatus("", true); byId("requester-name").focus(); };
      form.addEventListener("submit", async (event) => {
        event.preventDefault(); if (lockedAfterSuccess) return; const validation = validate(); if (validation) { setStatus(validation, false); return; }
        if (!activeKey) activeKey = crypto.randomUUID(); submitButton.disabled = true; setStatus("접수 중입니다…", true);
        const categoryText = category.value; const subjectText = categoryText + " · " + valueOf("subject"); const messageText = finalMessage();
        const payload = { requester_name: valueOf("requester-name"), requester_email: valueOf("requester-email"), subject: subjectText, message: messageText, idempotency_key: activeKey };
        const controller = new AbortController(); const timer = window.setTimeout(() => controller.abort(), 15000);
        try {
          const response = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(payload), signal: controller.signal });
          let body = null; try { body = await response.json(); } catch (_) { body = null; }
          const result = body && body.data;
          if (!response.ok || !result || typeof result !== "object") { submitButton.disabled = false; setStatus(errorMessage(body && body.error ? body.error.code : "", response.status), false); return; }
          if (result.status === "auto_reply_ready" && typeof result.guidance_text === "string" && result.guidance_text.length > 0) { showReceipt(result, categoryText, result.guidance_text, "먼저 확인해 보세요"); }
          else if (result.duplicate === true) { showReceipt(result, categoryText, typeof result.guidance_text === "string" ? result.guidance_text : null, "이미 접수된 문의입니다."); }
          else if (result.status === "awaiting_admin") { showReceipt(result, categoryText, null, "문의가 접수되었습니다.\n확인이 필요한 내용은 담당자가 살펴본 뒤 안내합니다."); }
          else { showReceipt(result, categoryText, null, "문의가 접수되었습니다.\n접수번호를 보관해 주세요."); }
          lockedAfterSuccess = true; submitButton.disabled = true; newButton.classList.remove("hidden"); setStatus("문의가 정상적으로 접수되었습니다.", true);
        } catch (error) { submitButton.disabled = false; setStatus(error && error.name === "AbortError" ? "접수 결과를 확인하지 못했습니다.\n같은 문의를 바로 새로 작성하지 마세요.\n다시 확인하면 같은 접수번호로 확인합니다." : errorMessage("", 0), false); }
        finally { window.clearTimeout(timer); }
      });
      newButton.addEventListener("click", resetForm);
      byId("copy-button").addEventListener("click", async () => { if (!lastInquiryId) return; try { await navigator.clipboard.writeText(lastInquiryId); setStatus("접수번호를 복사했습니다.", true); } catch (_) { setStatus("접수번호를 복사하지 못했습니다.", false); } });
      byId("print-button").addEventListener("click", () => window.print());
    })();
  </script>
</body>
</html>
