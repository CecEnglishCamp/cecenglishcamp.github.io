<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>문의 안내 — CEC English Camp</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{
  --bg:#0a1628;--panel:#132040;
  --cyan:#00f2ff;--gold:#c9a961;--gold2:#e8c983;
  --cream:#f5f0e8;--ash:#8a9ab8;
  --gold-line:rgba(201,169,97,0.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Georgia','Malgun Gothic','Apple SD Gothic Neo',serif;background:var(--bg);color:var(--cream);min-height:100vh}
.nav{background:rgba(10,22,40,.95);border-bottom:1px solid var(--gold-line);display:flex;align-items:center;justify-content:space-between;padding:.9rem 2rem}
.nav-logo{font-size:1.1rem;color:var(--gold);letter-spacing:.08em;text-decoration:none;font-weight:bold}
.nav-logo span{color:var(--cyan)}
.nav-back{font-size:.75rem;color:var(--ash);text-decoration:none;padding:.4rem .9rem;border:1px solid rgba(138,154,184,.3);border-radius:2px}
.nav-back:hover{color:var(--gold);border-color:var(--gold)}
.page{max-width:680px;margin:0 auto;padding:4rem 1rem 6rem}
.page-eyebrow{font-size:.75rem;letter-spacing:.3em;color:var(--gold);margin-bottom:1.2rem}
.page h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:400;line-height:1.3;margin-bottom:1.2rem}
.page-intro{font-size:1.05rem;line-height:1.85;color:var(--ash);margin-bottom:2.5rem}
.contact-block{background:var(--panel);border:1px solid var(--gold-line);padding:2rem;margin-bottom:2rem}
.contact-row{display:flex;align-items:flex-start;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--gold-line)}
.contact-row:last-child{border-bottom:none}
.contact-label{font-size:.8rem;color:var(--ash);min-width:80px;padding-top:.15rem}
.contact-value{font-size:1rem;line-height:1.6;color:var(--cream);word-break:break-all}
.contact-value a,.note a{color:var(--gold);text-decoration:none}
.contact-value a:hover,.note a:hover{color:var(--gold2);text-decoration:underline}
.note{font-size:.92rem;line-height:1.8;color:var(--ash);padding:1.2rem 1.5rem;border-left:3px solid var(--gold-line)}
.note strong{color:var(--cream)}
footer{text-align:center;padding:2rem;border-top:1px solid var(--gold-line);font-size:.75rem;letter-spacing:.1em;color:var(--ash)}
footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>

<nav class="nav">
  <a href="/index.html" class="nav-logo">CEC <span>English Camp</span></a>
  <a href="/index.html" class="nav-back">← 홈</a>
</nav>

<div class="page">
  <div class="page-eyebrow">◆ 문의 안내</div>
  <h1>문의는 이메일로 보내 주세요</h1>
  <p class="page-intro">
    로그인, 수업 이용, 구독과 결제 등 궁금한 점이 있으면 아래 이메일로 보내 주세요.
  </p>

  <div class="contact-block">
    <div class="contact-row">
      <div class="contact-label">이메일</div>
      <div class="contact-value">
        <a href="mailto:contact.cecenglishcamp@gmail.com">contact.cecenglishcamp@gmail.com</a>
      </div>
    </div>
    <div class="contact-row">
      <div class="contact-label">답장</div>
      <div class="contact-value">보통 1~2 영업일 안에 답장드립니다.</div>
    </div>
  </div>

  <div class="note">
    <strong>보내실 때 참고해 주세요.</strong><br>
    비밀번호와 카드 번호는 이메일에 적지 마세요.<br>
    연락처 안내는 <a href="/contact.html">Contact 페이지</a>에서도 볼 수 있습니다.
  </div>
</div>

<footer>
  CEC ENGLISH CAMP · Fremont, CA · <a href="/index.html">← 홈</a>
</footer>

</body>
</html>
