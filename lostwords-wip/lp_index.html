<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#1b140d}
body{display:flex;align-items:center;justify-content:center;padding:24px;font-family:Georgia,'Times New Roman',serif}
.lw-book{position:relative;width:100%;max-width:1440px;aspect-ratio:1672/941}
.lw-scene-bg-full{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0;pointer-events:none}
.lw-nameplate-text{position:absolute;z-index:2}
.lw-nameplate-top{left:46.95%;top:4.68%;width:9.27%;height:4.67%}
.lw-nameplate-bottom{left:46.59%;top:86.72%;width:9.63%;height:3.93%}

.lp-screen{
  position:absolute;left:25.06%;top:15.73%;width:51.91%;height:65.99%;
  background:rgb(253,212,139);border-radius:4px;
  display:flex;flex-direction:column;align-items:center;
  padding:2.2% 2.6% 1.6%;overflow:hidden;z-index:1;
}
.lp-subtitle{
  font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;
  color:#5a4426;font-size:clamp(11px,1.35vw,18px);text-align:center;flex-shrink:0;
  margin-bottom:clamp(4px,1.1vw,14px);
}
.lp-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.3vw,16px);
  width:100%;flex:1;min-height:0;
}
.lp-card{
  display:flex;flex-direction:column;text-decoration:none;color:inherit;
  border-radius:8px;overflow:hidden;background:#fffdf6;
  border:1px solid rgba(154,138,106,.3);
  box-shadow:0 3px 8px rgba(120,110,90,.14);
  transition:transform .15s,box-shadow .15s;min-height:0;
}
.lp-card:hover{transform:translateY(-3px);box-shadow:0 8px 16px rgba(120,110,90,.22)}
.lp-card-img-wrap{position:relative;width:100%;flex:1;min-height:0;overflow:hidden;background:#0f1117}
.lp-card-img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.lp-card-num{
  position:absolute;top:4px;left:4px;background:rgba(20,14,8,.72);color:#f3e4c4;
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(9px,1vw,13px);
  padding:1px 7px;border-radius:10px;letter-spacing:.03em;
}
.lp-card-label{
  font-family:'Gowun Batang',Georgia,serif;color:#4a3f2e;text-align:center;
  font-size:clamp(8px,0.95vw,12px);line-height:1.3;padding:4px 4px 5px;flex-shrink:0;
}
@media(max-width:900px){
  .lp-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
